name: preview
# A Cloudflare Worker Preview for every pull request from this repo: its own URL, bound to
# preview-only D1, KV and queue (see `previews` in wrangler.jsonc), so it can't touch production
# data or send email. Production deploys only from main (deploy.yml).
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    # Fork PRs never get secrets; only branches in this repo get a Preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Synced from Infisical as CLOUDFLARE_API_KEY (it is an API token); wrangler reads CLOUDFLARE_API_TOKEN.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to the shared Preview database
        run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
      - name: Create or update this branch's Preview
        run: |
          # Preview names: lowercase letters, digits and dashes, from the branch name (never interpolated raw).
          name=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-50)
          npx wrangler preview --name "$name" --json > preview.json
          url=$(jq -r '.preview_url // .url // empty' preview.json)
          echo "### Preview: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-see preview.json in the log}" >> "$GITHUB_STEP_SUMMARY"
          cat preview.json
